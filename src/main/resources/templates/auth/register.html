<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PrepSprint</title>
    <style>
        :root {
            --verdigris: #75B9BF;
            --light-blue: #B7DDDA;
            --alabaster: #F2ECE1;
            --misty-rose: #FCDDD3;
            --pale-dogwood: #E6C4B7;
            --dark-text: #243238;
            --muted-text: #68777B;
            --success: #5A9E72;
            --error: #C96B6B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--alabaster);
            color: var(--dark-text);
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(36, 50, 56, 0.08);
            width: 100%;
            max-width: 440px;
            padding: 32px 24px;
            border: 1px solid var(--pale-dogwood);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--dark-text);
            letter-spacing: -0.5px;
        }

        .brand-title span {
            color: var(--verdigris);
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--muted-text);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--dark-text);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--pale-dogwood);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background-color: #FAFAFA;
        }

        .form-input:focus {
            border-color: var(--verdigris);
            box-shadow: 0 0 0 3px rgba(117, 185, 191, 0.2);
            background-color: #FFFFFF;
        }

        .field-error {
            color: var(--error);
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--verdigris);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(117, 185, 191, 0.3);
            margin-top: 8px;
        }

        .btn-primary:hover {
            background-color: #5FA5AC;
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--muted-text);
        }

        .auth-footer a {
            color: var(--verdigris);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand-header">
        <h1 class="brand-title">Prep<span>Sprint</span></h1>
        <p class="brand-subtitle">Create your student account to get started</p>
    </div>

    <form th:action="@{/auth/register}" method="post" th:object="${registerDto}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" class="form-input" th:field="*{name}" placeholder="John Doe" required />
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" th:field="*{email}" placeholder="student@example.com" required />
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password (min 8 chars)</label>
            <input type="password" id="password" class="form-input" th:field="*{password}" placeholder="••••••••" required />
            <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-input" th:field="*{confirmPassword}" placeholder="••••••••" required />
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </div>

        <button type="submit" class="btn-primary">Register</button>
    </form>

    <div class="auth-footer">
        Already have an account? <a th:href="@{/auth/login}">Log in here</a>
    </div>
</div>

</body>
</html>
