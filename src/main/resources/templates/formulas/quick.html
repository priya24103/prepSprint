<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Formula Mode - PrepSprint</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <style>
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            padding: var(--space-md);
        }

        .quick-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: var(--space-md);
            border-bottom: 1px solid #1E293B;
        }

        .quick-card {
            background: #1E293B;
            border-radius: var(--radius-lg);
            border: 1px solid #334155;
            padding: var(--space-xl) var(--space-lg);
            text-align: center;
            max-width: 680px;
            width: 100%;
            margin: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .quick-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #F8FAFC;
            margin-bottom: var(--space-xs);
        }

        .quick-topic {
            font-size: 0.85rem;
            color: var(--color-verdigris);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: var(--space-lg);
        }

        .quick-expression-box {
            background: #090D16;
            border: 2px solid var(--color-verdigris);
            border-radius: var(--radius-md);
            padding: var(--space-lg);
            font-family: "Georgia", "Cambria", serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: var(--space-lg);
            line-height: 1.4;
            letter-spacing: 1px;
            word-break: break-word;
        }

        .quick-meta {
            font-size: 0.95rem;
            color: #94A3B8;
            margin-bottom: var(--space-md);
            text-align: left;
            background: rgba(255,255,255,0.03);
            padding: var(--space-md);
            border-radius: var(--radius-md);
        }

        .quick-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            gap: var(--space-md);
        }

        .btn-quick-nav {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: var(--radius-md);
        }
    </style>
</head>
<body>

<!-- Minimal Top Bar -->
<div class="quick-top-bar">
    <div style="font-weight: 800; color: var(--color-verdigris); font-size: 1.1rem;">⚡ Quick Formula Scan</div>
    <div style="font-size: 0.9rem; color: #94A3B8;">
        Formula <strong th:text="${currentIndex + 1}">1</strong> of <strong th:text="${totalCount}">10</strong>
    </div>
    <a th:href="@{/formulas(topicId=${selectedTopicId})}" class="btn btn-sm btn-outline" style="color: #94A3B8; border-color: #334155;">
        ✕ Exit Mode
    </a>
</div>

<!-- Center One-Formula Card -->
<div class="quick-card">
    <div class="quick-topic" th:text="${currentFormula.topicName}">Topic Name</div>
    <h2 class="quick-title" th:text="${currentFormula.title}">Formula Title</h2>

    <!-- Large Math Expression -->
    <div class="quick-expression-box" th:text="${currentFormula.formula}">
        Formula Expression
    </div>

    <!-- Variables & Shortcut Info -->
    <div class="quick-meta" th:if="${currentFormula.variables != null and !currentFormula.variables.isEmpty()}">
        <strong style="color: var(--color-verdigris);">Key Variables:</strong>
        <div th:text="${currentFormula.variables}">Variables</div>
    </div>

    <div class="quick-meta" th:if="${currentFormula.shortcut != null and !currentFormula.shortcut.isEmpty()}">
        <strong style="color: #FACC15;">💡 Shortcut / Tip:</strong>
        <div th:text="${currentFormula.shortcut}">Shortcut</div>
    </div>
</div>

<!-- Bottom Navigation Bar -->
<div class="quick-nav-bar">
    <a th:if="${hasPrev}" th:href="@{/formulas/quick(topicId=${selectedTopicId}, index=${currentIndex - 1})}" class="btn btn-secondary btn-quick-nav">
        ← Previous
    </a>
    <span th:unless="${hasPrev}" class="btn btn-secondary btn-quick-nav" style="opacity: 0.3; pointer-events: none;">
        ← Previous
    </span>

    <a th:if="${hasNext}" th:href="@{/formulas/quick(topicId=${selectedTopicId}, index=${currentIndex + 1})}" class="btn btn-primary btn-quick-nav">
        Next Formula →
    </a>
    <a th:unless="${hasNext}" th:href="@{/formulas(topicId=${selectedTopicId})}" class="btn btn-primary btn-quick-nav">
        Done Scanning ✓
    </a>
</div>

</body>
</html>
