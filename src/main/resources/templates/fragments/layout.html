<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, activeNav)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">PrepSprint - Last-minute placement revision companion</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>

<!-- Navigation (Desktop Sidebar & Mobile Bottom Nav) -->
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="app-wrapper">
    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Dynamic Content -->
    <main class="main-content">
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

</body>
</html>
